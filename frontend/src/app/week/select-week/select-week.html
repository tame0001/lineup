<mat-form-field>
  <mat-label>Match Day</mat-label>
  <input
    matInput
    [matDatepicker]="matchDayPicker"
    [matDatepickerFilter]="matchDayFilter"
    (dateChange)="onMatchDaySelected($event.value)"
  />
  <mat-datepicker-toggle
    matIconSuffix
    [for]="matchDayPicker"
  ></mat-datepicker-toggle>
  <mat-datepicker #matchDayPicker></mat-datepicker>
</mat-form-field>
