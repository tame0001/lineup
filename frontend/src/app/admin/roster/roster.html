<div class="h-full grid grid-cols-2">
  <!-- Player list on the left -->
  <div class="grid grid-cols-5">
    @for (player of roster(); track $index) {
      <div class="flex justify-center items-center w-64">
        <!-- Select a player to view details on the right side -->
        <mat-card (click)="selectedPlayer.set(player)">
          <mat-card-header>{{ player.name }}</mat-card-header>
          <mat-card-content></mat-card-content>
        </mat-card>
      </div>
    }
  </div>
  <!-- Player details on the right -->
  <div class="flex justify-center items-center">
    @if (selectedPlayer()) {
      <app-player-admin [playerID]="selectedPlayer()?.id"></app-player-admin>
    } @else {
      <span>Select a player</span>
    }
  </div>
</div>
