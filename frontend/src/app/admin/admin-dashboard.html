<div class="grid grid-cols-3 h-full">
  <!-- Player Cards. Take 2 columns -->
  <div class="col-span-2 rsvp-container" [style.--number-of-columns]="6">
    @for (player of activePlayers(); track $index) {
      <app-player-card
        [player]="player"
        [rsvpInput]="rsvps().includes(player.id)"
        [weekID]="weekID()"
        (rsvpOutput)="RSVPChange($event)"
      ></app-player-card>
    }
  </div>

  <div class="justify-center align-center">
    <app-select-week (matchDayID)="updateWeekID($event)"></app-select-week>
    <div>{{ nPlayerIn() }} players have RSVP'd 'in'</div>
  </div>
</div>
