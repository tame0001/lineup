<div class="grid grid-cols-3 h-full">
  <!-- Player Cards. Take 2 columns -->
  <div
    class="col-span-2 rsvp-container"
    [style.--number-of-columns]="activePlayers().length ? '6' : '1'"
    style="border-right: 1px dashed"
  >
    @for (player of activePlayers(); track $index) {
      <app-player-card
        [player]="player"
        [rsvpInput]="rsvps().includes(player.id)"
        [weekID]="weekID()"
        (rsvpOutput)="RSVPChange()"
      ></app-player-card>
    } @empty {
      <!-- No active players to display -->
      <div class="flex justify-center items-center h-full">
        <span class="text-2xl">Please select match day</span>
      </div>
    }
  </div>

  <div class="justify-center align-center">
    <div class="grid grid-rows-4 h-full">
      <!-- Match week panel -->
      <div
        class="row-span-1 flex justify-center items-center gap-4"
        style="border-bottom: 1px dashed"
      >
        <app-select-week (matchDayID)="weekID.set($event)"></app-select-week>
        <button
          matFab
          matTooltip="Add new match day"
          (click)="openAddWeekSheet()"
        >
          <mat-icon>more_time</mat-icon>
        </button>
        <div>{{ rsvpCount() }} players have RSVP'd 'in'</div>
      </div>
      <!-- Line up panel -->
      <div class="row-span-3"></div>
    </div>
  </div>
</div>
