@if (player$ | async; as player) {
  <mat-card class="gap-4">
    <mat-card-header>{{ player.name }}</mat-card-header>
    <mat-card-content>
      <!-- Active status -->
      <mat-grid-list cols="3" rowHeight="4rem">
        <mat-grid-tile>Status</mat-grid-tile>
        <mat-grid-tile colspan="2"
          ><!-- Active status toggle -->
          <mat-button-toggle-group [] aria-label="Font Style">
            <mat-button-toggle
              value="Active"
              [checked]="player.is_active"
              (change)="changePlayerActiveStatus(true)"
              >Active</mat-button-toggle
            >
            <mat-button-toggle
              value="Inactive"
              [checked]="!player.is_active"
              (change)="changePlayerActiveStatus(false)"
              >Inactive</mat-button-toggle
            >
          </mat-button-toggle-group></mat-grid-tile
        >
        <!-- Reservation fee -->
        <mat-grid-tile>Fee</mat-grid-tile>
        <mat-grid-tile colspan="2"
          ><mat-button-toggle-group>
            <mat-button-toggle
              value="Paid"
              [checked]="player.is_paid"
              (change)="changePlayerPaidStatus(true)"
              >Paid</mat-button-toggle
            >
            <mat-button-toggle
              value="Unpaid"
              [checked]="!player.is_paid"
              (change)="changePlayerPaidStatus(false)"
              >Unpaid</mat-button-toggle
            >
          </mat-button-toggle-group></mat-grid-tile
        >
      </mat-grid-list>
      <!-- Give some space -->
      <div class="h-4"></div>
      <!-- Advanced Options -->
      <mat-accordion>
        <mat-expansion-panel>
          <mat-expansion-panel-header>
            <mat-panel-title>Advanced Options</mat-panel-title>
          </mat-expansion-panel-header>
          <div class="flex flex-col gap-4">
            <div>
              <mat-form-field>
                <mat-label>Active Since</mat-label>
                <input
                  matInput
                  [matDatepicker]="activeDate"
                  (dateChange)="changePlayerActiveStatus(true, $event.value)"
                  [value]="player.active_since"
                />
                <mat-datepicker-toggle
                  matIconSuffix
                  [for]="activeDate"
                ></mat-datepicker-toggle>
                <mat-datepicker #activeDate></mat-datepicker>
              </mat-form-field>
            </div>

            <div>
              <mat-form-field>
                <mat-label>Inactive Since</mat-label>
                <input
                  matInput
                  [matDatepicker]="inactiveDate"
                  (dateChange)="changePlayerActiveStatus(false, $event.value)"
                  [value]="player.inactive_since"
                />
                <mat-datepicker-toggle
                  matIconSuffix
                  [for]="inactiveDate"
                ></mat-datepicker-toggle>
                <mat-datepicker #inactiveDate></mat-datepicker>
              </mat-form-field>
            </div>
          </div>
        </mat-expansion-panel>
      </mat-accordion>
    </mat-card-content>
  </mat-card>
}
