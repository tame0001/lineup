@if (player$ | async; as player) {
  <div class="flex flex-col gap-4">
    <!-- Show player name -->
    <h1>{{ player.name }}</h1>
    <!-- Show active status -->
    <p>Active Status: {{ player.is_active ? "Active" : "Inactive" }}</p>
    <p>Active Since: {{ player.active_since }}</p>
    <p>Inactive Since: {{ player.inactive_since }}</p>
    <p>Is Admin: {{ player.is_admin ? "Yes" : "No" }}</p>

    <!-- Admin status toggle -->
    <div>
      <mat-button-toggle-group>
        <mat-button-toggle value="Admin" [checked]="player.is_admin"
          >Admin</mat-button-toggle
        >
        <mat-button-toggle value="User" [checked]="!player.is_admin"
          >User</mat-button-toggle
        >
      </mat-button-toggle-group>
    </div>

    <!-- Paid status toggle -->
    <div class="m-4 rounded">
      <span class="mx-4">Paid Status</span>
      <mat-button-toggle-group class="mx-4">
        <mat-button-toggle
          value="Paid"
          [checked]="player.is_paid"
          (change)="changePlayerPaidStatus(true)"
          >Paid</mat-button-toggle
        >
        <mat-button-toggle
          value="Unpaid"
          [checked]="!player.is_paid"
          (change)="changePlayerPaidStatus(false)"
          >Unpaid</mat-button-toggle
        >
      </mat-button-toggle-group>
    </div>

    <!-- Active status toggle -->
    <!-- <mat-button-toggle-group [] aria-label="Font Style">
      <mat-button-toggle
        value="Active"
        [checked]="player.is_active"
        (change)="changePlayerActiveStatus(true)"
        >Active</mat-button-toggle
      >
      <mat-button-toggle
        value="Inactive"
        [checked]="!player.is_active"
        (change)="changePlayerActiveStatus(false)"
        >Inactive</mat-button-toggle
      >
    </mat-button-toggle-group> -->
  </div>
}
