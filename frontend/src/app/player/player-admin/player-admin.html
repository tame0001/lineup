@if (player$ | async; as player) {
  <div class="flex flex-col gap-4">
    <!-- Show player name -->
    <h1>{{ player.name }}</h1>
    <!-- Show active status -->
    <p>Active Status: {{ player.is_active ? "Active" : "Inactive" }}</p>
    <div>
      <p>Active Since:</p>
      <mat-form-field>
        <input
          matInput
          [matDatepicker]="activeDate"
          (dateChange)="changeActiveSinceDate($event.value)"
          [value]="player.active_since"
        />
        <mat-datepicker-toggle
          matIconSuffix
          [for]="activeDate"
        ></mat-datepicker-toggle>
        <mat-datepicker #activeDate></mat-datepicker>
      </mat-form-field>
    </div>

    <div>
      <p>Inactive Since:</p>
      <mat-form-field>
        <input
          matInput
          [matDatepicker]="inactiveDate"
          (dateChange)="changeInactiveSinceDate($event.value)"
          [value]="player.inactive_since"
        />
        <mat-datepicker-toggle
          matIconSuffix
          [for]="inactiveDate"
        ></mat-datepicker-toggle>
        <mat-datepicker #inactiveDate></mat-datepicker>
      </mat-form-field>
    </div>

    <!-- Paid status toggle -->
    <div class="m-4">
      <span class="mx-4">Paid Status</span>
      <mat-button-toggle-group class="mx-4">
        <mat-button-toggle
          value="Paid"
          [checked]="player.is_paid"
          (change)="changePlayerPaidStatus(true)"
          >Paid</mat-button-toggle
        >
        <mat-button-toggle
          value="Unpaid"
          [checked]="!player.is_paid"
          (change)="changePlayerPaidStatus(false)"
          >Unpaid</mat-button-toggle
        >
      </mat-button-toggle-group>
    </div>

    <!-- Active status toggle -->
    <mat-button-toggle-group [] aria-label="Font Style">
      <mat-button-toggle
        value="Active"
        [checked]="player.is_active"
        (change)="changePlayerActiveStatus(true)"
        >Active</mat-button-toggle
      >
      <mat-button-toggle
        value="Inactive"
        [checked]="!player.is_active"
        (change)="changePlayerActiveStatus(false)"
        >Inactive</mat-button-toggle
      >
    </mat-button-toggle-group>
  </div>
}
